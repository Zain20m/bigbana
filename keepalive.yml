name: keepalive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        env:
          URL: ${{ secrets.KEEP_ALIVE_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "Set repo secret KEEP_ALIVE_URL to your Railway or preview /health URL"
            exit 0
          fi
          curl -sf --max-time 20 "$URL" || curl -sf --max-time 20 "${URL%/health}/health" || true
